name: CI

# Actions are pinned to full commit SHAs (the comment names the version), so a moved or
# hijacked tag cannot change what runs here. Dependabot proposes the updates.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Agent evals: each agent's rules scored against labeled cases. A suite below its
      # threshold fails the build. Also part of the unit tests; run here for the scores table.
      - name: Agent evals
        run: npm run evals
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the pull request's commits to know what to scan.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
